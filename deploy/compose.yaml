name: demo-site
services:
  app:
    image: demo-site:${AWCP_RELEASE:?Set AWCP_RELEASE to the deployed commit}
    restart: unless-stopped
    ports:
      - "127.0.0.1:11983:2181"
    environment:
      AWCP_LISTEN: "0.0.0.0:2181"
      AWCP_DATABASE: /data/awcp.sqlite
      AWCP_STATIC_DIR: /app/web
      AWCP_ALLOWED_ORIGINS: https://demo-site.zenmind.cc
      AWCP_SECURE_COOKIE: "true"
      AWCP_DATA_PROFILE: ${AWCP_DATA_PROFILE:-acceptance}
      AWCP_MCP_ENABLED: ${AWCP_MCP_ENABLED:-false}
      AWCP_MCP_PUBLIC_URL: https://demo-site.zenmind.cc/mcp
      AWCP_MCP_USERNAME: ${AWCP_MCP_USERNAME:-demo}
      AWCP_MCP_PASSWORD: ${AWCP_MCP_PASSWORD:-}
      AWCP_MCP_PUBLIC_DEMO_LOGIN: ${AWCP_MCP_PUBLIC_DEMO_LOGIN:-false}
      AWCP_MCP_RESET_ENABLED: ${AWCP_MCP_RESET_ENABLED:-false}
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
